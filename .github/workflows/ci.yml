name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: Schemas Diff
            command: schemas:diff
          - name: Schemas Parse
            command: schemas:parse
          - name: Lint
            command: lint
          - name: Typecheck
            command: typecheck
          - name: Format
            command: format:check
          - name: Security Audit
            command: audit
          - name: Tests
            command: test:run

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run check
        run: npm run ${{ matrix.command }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build
